<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صالون جودة الأظافر</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #fff9fb, #f7edf3);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .box {
      width: min(500px, 100%);
      background: #fff;
      border: 1px solid #f0d7df;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(199, 92, 122, 0.12);
      padding: 28px;
    }
    h2 {
      text-align: center;
      color: #c65d7a;
      margin-top: 0;
      margin-bottom: 16px;
    }
    h3 {
      margin: 0 0 14px;
      color: #6b4d57;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #efd4dc;
      margin-bottom: 12px;
      font-size: 16px;
    }
    button {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #d96b87, #e18aa4);
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .toggle {
      margin-top: 16px;
      text-align: center;
      color: #7d5d66;
      cursor: pointer;
      font-size: 14px;
    }
    .alert {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    .alert.error {
      display: block;
      background: #fde8e8;
      color: #b33636;
    }
    .alert.success {
      display: block;
      background: #eafaf1;
      color: #1c8a5d;
    }
    .admin-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8c5c6d;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>صالون جودة الأظافر</h2>

    <div id="registerBox">
      <h3>تسجيل عميلة جديدة</h3>

      <input id="regName" type="text" placeholder="الاسم الكامل" />
      <input id="regPhone" type="tel" placeholder="رقم الجوال" />
      <input id="regPassword" type="password" placeholder="كلمة المرور" />

      <button id="registerBtn">تسجيل</button>
      <div class="toggle" id="showLogin">لدي حساب بالفعل</div>
    </div>

    <div id="loginBox" style="display:none;">
      <h3>تسجيل الدخول</h3>

      <input id="loginPhone" type="tel" placeholder="رقم الجوال" />
      <input id="loginPassword" type="password" placeholder="كلمة المرور" />

      <button id="loginBtn">دخول</button>
      <div class="toggle" id="showRegister">إنشاء حساب جديد</div>
    </div>

    <div id="message" class="alert"></div>

    <a class="admin-link" href="admin.html">لوحة الإدارة</a>
  </div>

  <script>
    const CLIENTS_KEY = "nail_quality_clients";
    const CURRENT_CLIENT_KEY = "nail_quality_current_client";

    function getClients() {
      const data = localStorage.getItem(CLIENTS_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveClients(clients) {
      localStorage.setItem(CLIENTS_KEY, JSON.stringify(clients));
    }

    function showMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "alert " + type;
    }

    document.getElementById("showLogin").addEventListener("click", () => {
      document.getElementById("registerBox").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
    });

    document.getElementById("showRegister").addEventListener("click", () => {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("registerBox").style.display = "block";
    });

    document.getElementById("registerBtn").addEventListener("click", () => {
      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      if (!name || !phone || !password) {
        showMessage("يرجى تعبئة جميع الحقول", "error");
        return;
      }

      const clients = getClients();
      const samePhone = clients.some(c => c.phone === phone);

      if (samePhone) {
        showMessage("هذا الرقم مسجل مسبقاً، لا يمكنك تسجيل حساب جديد بنفس الرقم", "error");
        return;
      }

      const newClient = {
        id: Date.now(),
        name,
        phone,
        password,
        role: "client",
        createdAt: new Date().toISOString()
      };

      clients.push(newClient);
      saveClients(clients);

      localStorage.setItem(CURRENT_CLIENT_KEY, JSON.stringify({
        id: newClient.id,
        name: newClient.name,
        phone: newClient.phone
      }));

      showMessage("تم إنشاء الحساب بنجاح", "success");

      setTimeout(() => {
        window.location.href = "client.html";
      }, 800);
    });

    document.getElementById("loginBtn").addEventListener("click", () => {
      const phone = document.getElementById("loginPhone").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!phone || !password) {
        showMessage("يرجى إدخال رقم الجوال وكلمة المرور", "error");
        return;
      }

      const clients = getClients();
      const matched = clients.find(c => c.phone === phone && c.password === password);

      if (!matched) {
        showMessage("بيانات الدخول غير صحيحة", "error");
        return;
      }

      localStorage.setItem(CURRENT_CLIENT_KEY, JSON.stringify({
        id: matched.id,
        name: matched.name,
        phone: matched.phone
      }));

      showMessage("تم تسجيل الدخول بنجاح", "success");

      setTimeout(() => {
        window.location.href = "client.html";
      }, 800);
    });
  </script>
</body>
</html>
