function conflicts(date,time,staffId,duration,ignoreId){const start=timeToMin(time),end=start+(Number(duration)||30);return db.bookings.some(b=>b.id!==ignoreId&&b.date===date&&b.staffId===staffId&&!["cancelled","noShow"].includes(b.status)&&start<timeToMin(b.time)+(Number(b.duration)||30)&&end>timeToMin(b.time))}

function renderClient(){if(db.session?.type!=="client"||!currentUser()){renderHome();return}$("#homeBtn").classList.remove("hidden");applyLang();$("#app").innerHTML=headerPanel(t("clientPortal"),`${currentUser().name} • ${currentUser().code}`)+clientPanel()+`<div class="section-head"><button class="btn danger" onclick="clearSession()">${esc(t("logout"))}</button></div>`;$("#bookingDate").addEventListener("change",updateSlotHint);$("#bookingStaff").addEventListener("change",updateSlotHint);$("#bookingService").addEventListener("change",updateSlotHint);$("#bookingForm").addEventListener("submit",createBooking)}
function updateSlotHint(){const date=$("#bookingDate").value,staff=$("#bookingStaff").value,services=Array.from($("#bookingService").selectedOptions).map(o=>db.services.find(s=>s.id===o.value)).filter(Boolean);const duration=services.reduce((n,s)=>n+(Number(s.duration)||30),0);const time=$("#bookingTime").value;let msg="";if(date&&date<today())msg=t("datePast");else if(date&&db.blocks.some(b=>b.date===date&&b.fullDay&&(b.staffId==="all"||b.staffId===staff)))msg=t("dayClosed");else if(date&&time&&staff&&(isBlocked(date,time,staff)||conflicts(date,time,staff,duration||30)))msg=t("timeTaken");else msg="";$("#slotHint").textContent=msg||t("noSlots");$("#slotHint").className="notice full"+(msg?" bad":"")}
function createBooking(e){e.preventDefault();const c=currentUser(),services=Array.from($("#bookingService").selectedOptions).map(o=>db.services.find(s=>s.id===o.value&&s.active!==false)).filter(Boolean),staff=db.staff.find(s=>s.id===$("#bookingStaff").value&&s.active!==false),date=$("#bookingDate").value,time=$("#bookingTime").value;if(!c||!services.length||!staff||!date||!time){toast(t("required"));return}if(date<today()){toast(t("datePast"));return}const duration=services.reduce((n,s)=>n+(Number(s.duration)||30),0),start=timeToMin(time),end=start+duration;const blocked=db.blocks.some(b=>b.date===date&&(b.staffId==="all"||b.staffId===staff.id)&&(b.fullDay||(start<timeToMin(b.endTime)&&end>timeToMin(b.startTime))));if(blocked||conflicts(date,time,staff.id,duration)){toast(t("timeTaken"));return}const name=services.map(s=>textService(s)).join("، "),price=services.reduce((n,s)=>n+(Number(s.price)||0),0);const b={id:uid("book"),clientId:c.id,clientCode:c.code,customerName:c.name,phone:c.phone,serviceId:services[0].id,serviceIds:services.map(s=>s.id),serviceName:name,staffId:staff.id,date,time,duration,price,notes:$("#bookingNotes").value.trim(),status:"pending",createdAt:new Date().toISOString()};db.bookings.push(b);persist();const msg=`طلب حجز - ${db.settings.salonName}\nكود العميلة: ${c.code}\nالاسم: ${c.name}\nالخدمات: ${name}\nالموظفة: ${staff.name}\nالتاريخ: ${date}\nالوقت: ${time}\nالمدة: ${duration} دقيقة\nالسعر: ${money(price)}\nرقم الطلب: ${b.id}`;renderClient();window.open(`https://wa.me/${db.settings.whatsapp||WA_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener,noreferrer");toast(t("bookingSuccess"))}

function redeemPoints(){const c=currentUser();if(!c)return;const amount=prompt(t("redeemAsk"),"10");const n=Number(amount);if(!Number.isInteger(n)||n<=0||n>c.points){toast(t("required"));return}const r={id:uid("red"),clientId:c.id,clientCode:c.code,points:n,status:"pending",createdAt:new Date().toISOString()};db.redemptions.push(r);persist();const msg=`${t("loyaltyRedeemText")}\n${t("code")}: ${c.code}\n${t("redeemAmount")}: ${n}`;window.open(`https://wa.me/${db.settings.whatsapp||WA_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener,noreferrer");toast(t("redeemDone"))}

<div class="full"><div class="spread"><b>الخدمات في الفاتورة</b><button type="button" class="btn secondary small" onclick="clearCashierCart()">تفريغ الخدمات</button></div><div id="cashierCartRows" class="card" style="margin-top:8px;background:#fff">لم تتم إضافة خدمات بعد.</div></div><div class="card full" style="background:#fbf2f6"><div class="spread"><span>المجموع قبل الخصم والضريبة</span><b id="cashierSubtotal">0.00 ر.س</b></div><div class="spread"><span>الخصم</span><b id="cashierDiscountView">0.00 ر.س</b></div><div class="spread"><span>الضريبة</span><b id="cashierTaxView">0.00 ر.س</b></div><div class="spread" style="margin-top:8px"><span>الإجمالي النهائي</span><strong class="invoice-total" id="cashierTotal">0.00 ر.س</strong></div></div><button class="btn full" type="submit">إصدار وحفظ الفاتورة${""}</button></form></section><aside><div class="card"><h3>اختصارات الكاشير</h3><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn secondary" onclick="ownerTab('clients')">العميلات</button><button class="btn secondary" onclick="ownerTab('services')">إدارة الخدمات</button><button class="btn secondary" onclick="ownerTab('expenses')">المصروفات</button><button class="btn secondary" onclick="ownerTab('invoices')">سجل الفواتير</button></div><p class="muted tiny" style="margin-top:12px">سجل الفواتير موجود في صفحة مستقلة ويمكن البحث بالتاريخ والشهر والسنة.</p></div><div class="section-head"><h3>ملخص اليوم</h3></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span>فواتير اليوم</span><strong>${db.invoices.filter(i=>(i.date||String(i.createdAt||"").slice(0,10))===today()).length}</strong></div><div class="stat"><span>إيراد اليوم</span><strong>${money(db.invoices.filter(i=>(i.date||String(i.createdAt||"").slice(0,10))===today()).reduce((a,i)=>a+Number(i.total||0),0))}</strong></div></div></aside></div>`}
function setCashierCustomerMode(mode){const isNew=mode==="new";const n=$("#newCustomerFields"),e=$("#existingCustomerFields");if(!n||!e)return;n.classList.toggle("hidden",!isNew);e.classList.toggle("hidden",isNew);$("#customerModeNew").className="btn small "+(isNew?"":"secondary");$("#customerModeExisting").className="btn small "+(!isNew?"":"secondary");$("#newClientName").required=isNew;$("#newClientPhone").required=isNew;$("#invoiceClient").required=!isNew;}
function toggleCashierBookingFields(show){$("#cashierBookingFields")?.classList.toggle("hidden",!show);const ids=["cashierBookingDate","cashierBookingTime","cashierBookingType","cashierBookingStaff"];ids.forEach(id=>{const el=$("#"+id);if(el)el.required=!!show});}
function toggleHomeAddress(type){const wrap=$("#cashierHomeAddressWrap");if(!wrap)return;wrap.classList.toggle("hidden",type!=="home");$("#cashierHomeAddress").required=type==="home";}
function setupCashier(){const service=$("#invoiceService"),search=$("#serviceSearchCashier");if(!service)return;setCashierCustomerMode("new");service.addEventListener("change",()=>{if(service.value)addCashierService(service.value)});search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase(),matches=activeServices().filter(s=>(s.name+" "+(s.nameEn||"")).toLowerCase().includes(q));$("#cashierSearchResults").innerHTML=q?`<div class="service-grid">${matches.map(s=>`<button type="button" class="service" onclick="addCashierService('${s.id}')"><b>${esc(textService(s))}</b><div class="price">${money(s.price)}</div><small>${s.duration} دقيقة</small></button>`).join("")||"لا توجد خدمات مطابقة"}</div>`:""});["invoiceDiscount","invoiceTaxRate"].forEach(id=>$("#"+id).addEventListener("input",updateCashierTotals));const clientSearch=$("#invoiceClientSearch");clientSearch.addEventListener("input",()=>{const q=clientSearch.value.trim().toLowerCase();Array.from($("#invoiceClient").options).forEach((o,i)=>{if(i===0){o.hidden=false;return}const c=db.clients.find(x=>x.id===o.value);o.hidden=!!q&&!((c?.name||"").toLowerCase().includes(q)||(c?.phone||"").toLowerCase().includes(q)||(c?.code||"").toLowerCase().includes(q))});});$("#invoiceClient").addEventListener("change",()=>{const c=db.clients.find(x=>x.id===$("#invoiceClient").value);$("#selectedClientInfo").textContent=c?`الكود: ${c.code||"—"} • النقاط: ${Number(c.points)||0}`:""});$("#invoiceForm").addEventListener("submit",submitInvoice);renderCashierCart()}
function addCashierService(id){const svc=db.services.find(s=>s.id===id&&s.active!==false);if(!svc)return;const found=cashierCart.find(x=>x.serviceId===id);if(found)found.quantity++;else cashierCart.push({serviceId:svc.id,name:textService(svc),price:Number(svc.price)||0,quantity:1,duration:Number(svc.duration)||30});const sel=$("#invoiceService");if(sel)sel.value="";const search=$("#serviceSearchCashier");if(search)search.value="";const results=$("#cashierSearchResults");if(results)results.innerHTML="";renderCashierCart()}
function removeCashierService(id){cashierCart=cashierCart.filter(x=>x.serviceId!==id);renderCashierCart()}
function changeCartPrice(id,value){const item=cashierCart.find(x=>x.serviceId===id);if(item){item.price=Math.max(0,Number(value)||0);updateCashierTotals()}}
function changeCartQty(id,value){const item=cashierCart.find(x=>x.serviceId===id);if(item){item.quantity=Math.max(1,Math.floor(Number(value)||1));renderCashierCart()}}
function clearCashierCart(){cashierCart=[];renderCashierCart()}
function cashierTotals(){const threshold=Math.max(1,Number(db.settings.redeemPoints)||50),value=Math.max(0,Number(db.settings.redeemRiyals)||10),used=Math.max(0,Math.floor(Number($("#invoicePointsUse")?.value)||0)),loyaltyDiscount=Math.floor(used/threshold)*value;const subtotal=cashierCart.reduce((a,x)=>a+x.price*x.quantity,0),discount=Math.min(subtotal,Math.max(0,Number($("#invoiceDiscount")?.value)||0)+loyaltyDiscount),taxable=Math.max(0,subtotal-discount),tax=taxable*Math.max(0,Number($("#invoiceTaxRate")?.value)||0)/100;return {subtotal,discount,loyaltyDiscount,tax,total:taxable+tax}}
function renderCashierCart(){const root=$("#cashierCartRows");if(!root)return;root.innerHTML=cashierCart.length?cashierCart.map(x=>`<div class="cart-row"><div><b>${esc(x.name)}</b><div class="tiny muted">${money(x.price)} لكل خدمة • ${Math.max(0,Number(db.services.find(s=>s.id===x.serviceId)?.loyaltyPoints)||0)} نقطة</div></div><input aria-label="سعر الخدمة" type="number" min="0" step=".01" value="${x.price}" onchange="changeCartPrice('${x.serviceId}',this.value)"><input aria-label="الكمية" type="number" min="1" step="1" value="${x.quantity}" onchange="changeCartQty('${x.serviceId}',this.value)"><button type="button" class="btn danger small" onclick="removeCashierService('${x.serviceId}')">حذف</button></div>`).join(""):`<div class="empty">ابحثي عن خدمة ثم أضيفيها إلى الفاتورة.</div>`;updateCashierTotals()}
function updateCashierTotals(){const out=$("#cashierSubtotal");if(!out)return;const x=cashierTotals();out.textContent=money(x.subtotal);$("#cashierDiscountView").textContent=money(x.discount);$("#cashierTaxView").textContent=money(x.tax);$("#cashierTotal").textContent=money(x.total)}
function submitInvoice(e){e.preventDefault();if(!cashierCart.length){toast("أضيفي خدمة واحدة على الأقل");return}const mode=$("#newCustomerFields").classList.contains("hidden")?"existing":"new";let client=null;if(mode==="new"){const name=$("#newClientName").value.trim(),phone=$("#newClientPhone").value.trim(),email=$("#newClientEmail").value.trim();if(!name||!phone){toast("أدخلي اسم العميلة ورقم جوالها");return}const duplicate=db.clients.find(c=>String(c.phone||"").replace(/\s/g,"")===phone.replace(/\s/g,""));if(duplicate){toast("رقم الجوال مسجل مسبقًا. اختاري البحث عن عميلة");setCashierCustomerMode("existing");$("#invoiceClientSearch").value=phone;$("#invoiceClient").value=duplicate.id;return}client={id:uid("cl"),code:"CL-"+db.counter++,name,phone,email,points:0,createdAt:new Date().toISOString()}}else{client=db.clients.find(c=>c.id===$("#invoiceClient").value)||null;if(!client){toast("اختاري العميلة المسجلة أو بدّلي إلى تسجيل عميلة جديدة");return}}const staffId=$("#invoiceStaff").value,payment=$("#invoicePayment").value,totals=cashierTotals(),pointsUse=Math.max(0,Math.floor(Number($("#invoicePointsUse").value)||0)),pointsAdd=Math.max(0,Math.floor(Number($("#invoicePointsAdd").value)||0));if(pointsUse&&(!Number.isInteger(pointsUse/(Math.max(1,Number(db.settings.redeemPoints)||50))))) {toast("يجب استبدال النقاط بمضاعفات الحد المحدد في إعدادات الولاء");return}if(pointsUse&&(!client||Number(client.points||0)<pointsUse)){toast("رصيد نقاط العميلة غير كافٍ");return}let booking=null;
if(mode==="new")db.clients.push(client);const items=cashierCart.map(x=>({...x,lineTotal:x.price*x.quantity}));const earnedPoints=items.reduce((sum,item)=>sum+Math.max(0,Math.floor(Number(db.services.find(s=>s.id===item.serviceId)?.loyaltyPoints)||0))*item.quantity,0);const invoice={id:uid("inv"),number:db.invoiceCounter++,clientId:client?.id||"",customerName:client?.name||"عميلة نقدية",customerPhone:client?.phone||"",staffId,items,serviceId:items[0]?.serviceId||"",serviceName:items.map(x=>`${x.name} ×${x.quantity}`).join("، "),subtotal:totals.subtotal,discount:totals.discount,taxRate:Number($("#invoiceTaxRate").value)||0,tax:totals.tax,total:totals.total,payment,pointsUsed:pointsUse,loyaltyDiscount:totals.loyaltyDiscount,pointsAdded:pointsAdd+earnedPoints,pointsEarned:earnedPoints,notes:$("#invoiceNotes").value.trim(),date:$("#invoiceDate").value,createdAt:new Date().toISOString(),bookingId:booking?.id||""};db.invoices.push(invoice);if(client){client.points=Math.max(0,Number(client.points||0)-pointsUse+pointsAdd+earnedPoints);client.updatedAt=new Date().toISOString()}for(const item of items){const svc=db.services.find(s=>s.id===item.serviceId);for(const mat of svc?.materials||[]){const stock=db.inventory.find(i=>i.id===mat.itemId);if(stock)stock.quantity=Math.max(0,Number(stock.quantity)-Number(mat.qty||0)*item.quantity)}}persist();cashierCart=[];renderOwner("cashier");toast("تم إصدار الفاتورة وحفظها")}
function invoiceTable(list=db.invoices){if(!list.length)return `<div class="empty">لا توجد فواتير مطابقة.</div>`;return `<div class="table-wrap"><table><thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>العميلة</th><th>الخدمات</th><th>الدفع</th><th>الإجمالي</th><th>الإجراءات</th></tr></thead><tbody>${list.slice().sort((a,b)=>(b.date||String(b.createdAt||"").slice(0,10)).localeCompare(a.date||String(a.createdAt||"").slice(0,10))).map(i=>`<tr><td>#${i.number}</td><td>${esc(i.date||String(i.createdAt||"").slice(0,10))}</td><td>${esc(i.customerName||clientName(i.clientId)||"—")}<br><small>${esc(i.customerPhone||"")}</small></td><td>${esc(i.serviceName||"—")}</td><td>${esc(i.payment||"cash")}</td><td>${money(i.total)}</td><td><div class="row"><button class="btn secondary small" onclick="editInvoice('${i.id}')">تعديل</button><button class="btn small" onclick="printInvoice('${i.id}')">طباعة</button><button class="btn danger small" onclick="deleteInvoice('${i.id}')">حذف</button></div></td></tr>`).join("")}</tbody></table></div>`}
function yearOptions(selected){return Array.from({length:27},(_,i)=>2024+i).map(y=>`<option value="${y}" ${Number(selected)===y?"selected":""}>${y}</option>`).join("")}
function monthOptions(selected){return Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${String(m).padStart(2,"0")}" ${String(selected).padStart(2,"0")===String(m).padStart(2,"0")?"selected":""}>${m}</option>`).join("")}
function invoicesPanel(){const d=today(),year=Number(d.slice(0,4))||2026,month=d.slice(5,7);return `<div class="card"><div class="spread"><div><h2>سجل الفواتير</h2><p class="muted">ابحثي عن الفواتير القديمة بالتاريخ أو الشهر أو السنة.</p></div><button class="btn secondary" onclick="window.print()">طباعة النتائج</button></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>بحث برقم الفاتورة أو اسم العميلة أو الجوال</label><input id="invoiceHistorySearch" placeholder="رقم الفاتورة / الاسم / الجوال"></div><div class="field"><label>طريقة التصفية</label><select id="invoiceHistoryMode"><option value="all">كل الفواتير</option><option value="range">من تاريخ إلى تاريخ</option><option value="month">شهر محدد</option><option value="year">سنة كاملة</option></select></div><div class="field"><label>من تاريخ</label><input id="invoiceHistoryFrom" type="date" min="2024-01-01" max="2050-12-31"></div><div class="field"><label>إلى تاريخ</label><input id="invoiceHistoryTo" type="date" min="2024-01-01" max="2050-12-31"></div><div class="field"><label>الشهر</label><select id="invoiceHistoryMonth">${monthOptions(month)}</select></div><div class="field"><label>السنة</label><select id="invoiceHistoryYear">${yearOptions(year)}</select></div><div class="row full"><button class="btn" onclick="filterInvoiceHistory()">بحث عن الفواتير</button><button class="btn secondary" onclick="resetInvoiceHistory()">إظهار الكل</button></div></div></div><div class="stats" style="margin:14px 0"><div class="stat"><span>عدد النتائج</span><strong id="invoiceHistoryCount">${db.invoices.length}</strong></div><div class="stat"><span>إجمالي الفواتير</span><strong id="invoiceHistoryTotal">${money(db.invoices.reduce((a,i)=>a+Number(i.total||0),0))}</strong></div></div><div id="invoiceHistoryTable">${invoiceTable()}</div>`}
function setupInvoiceFilters(){["invoiceHistorySearch","invoiceHistoryMode","invoiceHistoryFrom","invoiceHistoryTo","invoiceHistoryMonth","invoiceHistoryYear"].forEach(id=>$("#"+id)?.addEventListener(id==="invoiceHistorySearch"?"input":"change",filterInvoiceHistory));filterInvoiceHistory()}
function filterInvoiceHistory(){const root=$("#invoiceHistoryTable");if(!root)return;const q=$("#invoiceHistorySearch").value.trim().toLowerCase(),mode=$("#invoiceHistoryMode").value,from=$("#invoiceHistoryFrom").value,to=$("#invoiceHistoryTo").value,month=$("#invoiceHistoryMonth").value,year=$("#invoiceHistoryYear").value;let list=db.invoices.filter(i=>{const date=i.date||String(i.createdAt||"").slice(0,10);if(q&&!(`#${i.number} ${i.number} ${i.customerName||""} ${i.customerPhone||""} ${i.serviceName||""}`).toLowerCase().includes(q))return false;if(mode==="range"&&((from&&date<from)||(to&&date>to)))return false;if(mode==="month"&&!date.startsWith(`${year}-${month}`))return false;if(mode==="year"&&!date.startsWith(`${year}-`))return false;return true});root.innerHTML=invoiceTable(list);$("#invoiceHistoryCount").textContent=list.length;$("#invoiceHistoryTotal").textContent=money(list.reduce((a,i)=>a+Number(i.total||0),0))}
function resetInvoiceHistory(){["invoiceHistorySearch","invoiceHistoryFrom","invoiceHistoryTo"].forEach(id=>$("#"+id).value="");$("#invoiceHistoryMode").value="all";filterInvoiceHistory()}
function editInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const items=(i.items||[{serviceId:i.serviceId,name:i.serviceName,price:Number(i.total)||0,quantity:1}]);const servicesText=items.map(x=>`${x.name}|${x.price}|${x.quantity}`).join("\n");const customer=prompt("اسم العميلة",i.customerName||clientName(i.clientId)||"");if(customer===null)return;const phone=prompt("رقم جوال العميلة",i.customerPhone||"");if(phone===null)return;const date=prompt("تاريخ الفاتورة YYYY-MM-DD",i.date||String(i.createdAt||"").slice(0,10));if(date===null)return;const svcText=prompt("الخدمات — كل سطر: اسم الخدمة|السعر|الكمية",servicesText);if(svcText===null)return;const payment=prompt("طريقة الدفع: cash / card / transfer / points / mixed",i.payment||"cash");if(payment===null)return;const discount=prompt("الخصم بالريال",String(i.discount||0));if(discount===null)return;const taxRate=prompt("نسبة الضريبة %",String(i.taxRate||0));if(taxRate===null)return;const pointsUsed=prompt("النقاط المستخدمة",String(i.pointsUsed||0));if(pointsUsed===null)return;const pointsAdded=prompt("النقاط المضافة",String(i.pointsAdded||0));if(pointsAdded===null)return;const notes=prompt("ملاحظات الفاتورة",i.notes||"");if(notes===null)return;const staffOptions=db.staff.map(s=>`${s.id}:${s.name}`).join("\n");const staffId=prompt("معرّف الموظفة (اتركيه فارغًا بدون موظفة):\n"+staffOptions,i.staffId||"");if(staffId===null)return;const parsed=svcText.split(/\n/).map(line=>{const a=line.split("|");return {name:(a[0]||"").trim(),price:Number(a[1]),quantity:Math.floor(Number(a[2])||1)}}).filter(x=>x.name&&Number.isFinite(x.price)&&x.price>=0&&x.quantity>0);if(!parsed.length||!date||!Number.isFinite(Number(discount))||Number(discount)<0||!Number.isFinite(Number(taxRate))||Number(taxRate)<0||!Number.isInteger(Number(pointsUsed))||Number(pointsUsed)<0||!Number.isInteger(Number(pointsAdded))||Number(pointsAdded)<0){toast("تحققي من بيانات الفاتورة");return}const subtotal=parsed.reduce((a,x)=>a+x.price*x.quantity,0),d=Math.min(subtotal,Number(discount)),tax=(subtotal-d)*Number(taxRate)/100;const previousClient=db.clients.find(x=>x.id===i.clientId);if(previousClient){previousClient.points=Math.max(0,Number(previousClient.points||0)+(Number(i.pointsUsed)||0)-(Number(i.pointsAdded)||0))}const matchedClient=db.clients.find(x=>String(x.phone||"").trim()===phone.trim());i.clientId=matchedClient?.id||"";i.customerName=customer.trim();i.customerPhone=phone.trim();i.date=date;i.items=parsed.map(x=>({...x,lineTotal:x.price*x.quantity}));i.serviceName=parsed.map(x=>`${x.name} ×${x.quantity}`).join("، ");i.subtotal=subtotal;i.discount=d;i.taxRate=Number(taxRate);i.tax=tax;i.total=subtotal-d+tax;i.payment=payment;i.pointsUsed=Number(pointsUsed);i.pointsAdded=Number(pointsAdded);i.notes=notes;i.staffId=staffId.trim();i.updatedAt=new Date().toISOString();const c=db.clients.find(x=>x.id===i.clientId);if(c){c.points=Math.max(0,Number(c.points||0)-i.pointsUsed+i.pointsAdded)}persist();renderOwner(ownerActiveTab==="invoices"?"invoices":"cashier");toast("تم تعديل جميع بيانات الفاتورة")}

function reportsPanel(){const d=today(),year=Number(d.slice(0,4))||2026,month=d.slice(5,7);return `<div class="card"><div class="spread"><div><h2>تقارير الأرباح والإيرادات</h2><p class="muted">اختاري فترة زمنية مخصصة أو شهرًا أو سنة من 2024 إلى 2050.</p></div></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>الفترة</label><select id="reportMode"><option value="month">شهر محدد</option><option value="year">سنة كاملة</option><option value="range">من تاريخ إلى تاريخ</option><option value="all">كل الفترات</option></select></div><div class="field"><label>السنة</label><select id="reportYear">${yearOptions(year)}</select></div><div class="field"><label>الشهر</label><select id="reportMonth">${monthOptions(month)}</select></div><div class="field"><label>من تاريخ</label><input id="reportFrom" type="date" min="2024-01-01" max="2050-12-31" value="${d.slice(0,4)>="2024"?d:"2024-01-01"}"></div><div class="field"><label>إلى تاريخ</label><input id="reportTo" type="date" min="2024-01-01" max="2050-12-31" value="${d.slice(0,4)<="2050"?d:"2050-12-31"}"></div><div class="row full"><button class="btn" onclick="drawReports()">عرض التقرير</button><button class="btn secondary" onclick="setReportPreset('month')">هذا الشهر</button><button class="btn secondary" onclick="setReportPreset('year')">هذه السنة</button></div></div></div><div class="stats" style="margin-top:14px"><div class="stat"><span>الإيرادات</span><strong id="reportRevenue">0.00 ر.س</strong></div><div class="stat"><span>المصروفات</span><strong id="reportExpenses">0.00 ر.س</strong></div><div class="stat"><span>صافي الربح التقديري</span><strong id="reportProfit">0.00 ر.س</strong></div><div class="stat"><span>عدد الفواتير</span><strong id="reportInvoiceCount">0</strong></div></div><div class="section-head"><h3>الرسم البياني لصافي الربح</h3></div><div class="card"><p id="reportPeriodLabel" class="muted tiny"></p><div id="profitChart" class="chart-bars" style="height:230px"></div><div id="profitChartLabels" class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px"></div></div><div class="section-head"><h3>أداء الموظفات ضمن الفترة</h3></div><div class="card"><div id="staffChart" class="chart-bars"></div><div id="staffRows"></div></div><div class="section-head"><h3>الإيرادات حسب الموظفة</h3></div><div class="card" id="revenueStaff"></div>`}
function setReportPreset(mode){$("#reportMode").value=mode;drawReports()}
function reportDateFilter(date){const mode=$("#reportMode")?.value||"month",year=$("#reportYear")?.value||today().slice(0,4),month=$("#reportMonth")?.value||today().slice(5,7),from=$("#reportFrom")?.value,to=$("#reportTo")?.value;if(!date)return false;if(mode==="month")return date.startsWith(`${year}-${month}`);if(mode==="year")return date.startsWith(`${year}-`);if(mode==="range")return (!from||date>=from)&&(!to||date<=to);return true}
function drawReports(){const chart=$("#profitChart");if(!chart)return;const invoices=db.invoices.filter(i=>reportDateFilter(i.date||String(i.createdAt||"").slice(0,10))),expenses=db.expenses.filter(e=>reportDateFilter(e.date||String(e.createdAt||"").slice(0,10))),revenue=invoices.reduce((a,i)=>a+Number(i.total||0),0),costs=expenses.reduce((a,e)=>a+Number(e.amount||0),0),profit=revenue-costs;$("#reportRevenue").textContent=money(revenue);$("#reportExpenses").textContent=money(costs);$("#reportProfit").textContent=money(profit);$("#reportInvoiceCount").textContent=invoices.length;const mode=$("#reportMode").value,year=$("#reportYear").value,month=$("#reportMonth").value,from=$("#reportFrom").value,to=$("#reportTo").value;let keys=[];if(mode==="month"){const days=new Date(Number(year),Number(month),0).getDate();keys=Array.from({length:days},(_,i)=>`${year}-${month}-${String(i+1).padStart(2,"0")}`)}else if(mode==="year"){keys=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,"0")}`)}else if(mode==="range"&&from&&to){const a=new Date(from+"T12:00:00"),b=new Date(to+"T12:00:00");if(a<=b){const days=Math.round((b-a)/86400000)+1;if(days<=31){keys=Array.from({length:days},(_,i)=>{const x=new Date(a);x.setDate(x.getDate()+i);return x.toISOString().slice(0,10)})}else{let x=new Date(a.getFullYear(),a.getMonth(),1);while(x<=b){keys.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`);x.setMonth(x.getMonth()+1)}}}}else{const all=[...db.invoices.map(i=>i.date||String(i.createdAt||"").slice(0,10)),...db.expenses.map(e=>e.date||String(e.createdAt||"").slice(0,10))].filter(Boolean).sort();if(all.length){let x=new Date(all[0].slice(0,7)+"-01T12:00:00"),last=new Date(all[all.length-1].slice(0,7)+"-01T12:00:00");while(x<=last&&keys.length<36){keys.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`);x.setMonth(x.getMonth()+1)}}}const monthly=keys.map(key=>{const sumInv=invoices.filter(i=>(i.date||String(i.createdAt||"").slice(0,10)).startsWith(key)).reduce((a,i)=>a+Number(i.total||0),0),sumExp=expenses.filter(e=>(e.date||String(e.createdAt||"").slice(0,10)).startsWith(key)).reduce((a,e)=>a+Number(e.amount||0),0);return {key,profit:sumInv-sumExp,revenue:sumInv,expenses:sumExp}});const max=Math.max(1,...monthly.map(x=>Math.abs(x.profit)));chart.innerHTML=monthly.length?monthly.map(x=>`<div class="bar-col"><div class="bar" style="height:${Math.max(3,Math.abs(x.profit)/max*170)}px;${x.profit<0?"background:linear-gradient(#e9a1a8,#a32d3d)":""}" title="صافي الربح: ${money(x.profit)}"></div>${esc(x.key.length===10?x.key.slice(8):x.key.slice(5)+"/"+x.key.slice(0,4))}<br><b>${money(x.profit)}</b></div>`).join(""):`<div class="empty">لا توجد بيانات ضمن الفترة المحددة.</div>`;$("#reportPeriodLabel").textContent=mode==="month"?`الشهر ${month}/${year}`:mode==="year"?`السنة ${year}`:mode==="range"?`من ${from||"البداية"} إلى ${to||"النهاية"}`:"كل الفترات";$("#profitChartLabels").innerHTML=`<div><small>إجمالي الإيرادات</small><br><b>${money(revenue)}</b></div><div><small>إجمالي المصروفات</small><br><b>${money(costs)}</b></div><div><small>صافي الربح التقديري</small><br><b>${money(profit)}</b></div>`;const data=db.staff.map(s=>({name:s.name,count:db.bookings.filter(b=>b.staffId===s.id&&b.status==="completed"&&reportDateFilter(b.date)).length,revenue:invoices.filter(i=>i.staffId===s.id).reduce((a,i)=>a+Number(i.total||0),0)}));const cmax=Math.max(1,...data.map(x=>x.count));$("#staffChart").innerHTML=data.length?data.map(x=>`<div class="bar-col"><div class="bar" style="height:${Math.max(3,x.count/cmax*135)}px" title="${x.count}"></div>${esc(x.name)}<br><b>${x.count}</b></div>`).join(""):`<div class="empty">لا توجد بيانات</div>`;$("#staffRows").innerHTML=data.map(x=>`<div style="margin-top:12px"><div class="spread"><span>${esc(x.name)}</span><b>${x.count} خدمات مكتملة</b></div><div class="progress"><i style="width:${x.count/cmax*100}%"></i></div></div>`).join("");$("#revenueStaff").innerHTML=data.length?data.map(x=>`<div class="spread" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(x.name)}</span><b>${money(x.revenue)}</b></div>`).join(""):`<div class="empty">لا توجد بيانات</div>`}

function resetLocalData(){if(!confirm(t("resetWarn")))return;localStorage.removeItem(STORAGE_KEY);db=initialState();persist();localStorage.removeItem("qns_owner_pin");clearSession()}
function ownerSettings(){if(db.session?.type!=="owner"){toast(t("noPermission"));return}$("#modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="spread"><h2>${esc(t("adminSettings"))}</h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><form id="settingsForm" class="form-grid"><div class="field full"><label>${esc(t("businessName"))}</label><input name="salonName" value="${esc(db.settings.salonName)}" required></div><div class="field full"><label>WhatsApp</label><input name="whatsapp" value="${esc(db.settings.whatsapp||WA_NUMBER)}" required></div><button class="btn full">${esc(t("saveSettings"))}</button></form></div></div>`;$("#settingsForm").addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(e.currentTarget);db.settings.salonName=String(fd.get("salonName")).trim();db.settings.whatsapp=String(fd.get("whatsapp")).replace(/\D/g,"");persist();closeModal();renderOwner(ownerActiveTab);toast(t("saved"))})}
function renderApp(){if(!db.session){renderHome();return}if(db.session.type==="owner")renderOwner(ownerActiveTab);else if(db.session.type==="client")renderClient();else if(db.session.type==="employee")renderEmployee();else renderHome()}
$("#langBtn").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("qns_lang",lang);renderApp()});
$("#homeBtn").addEventListener("click",()=>{clearSession()});

/* مساعد المالكة المحلي: تحليل بيانات فعلية وإدخال فواتير نصية بمراجعة بشرية. */
let assistantDraft=[];
function ownerAssistantPanel(){
 const invoices=db.invoices||[], total=invoices.reduce((n,i)=>n+Number(i.total||0),0), expenses=(db.expenses||[]).reduce((n,e)=>n+Number(e.amount||0),0);
 const month=today().slice(0,7), thisMonth=invoices.filter(i=>String(i.date||i.createdAt||'').startsWith(month));
 const monthly=thisMonth.reduce((n,i)=>n+Number(i.total||0),0);
 const byService={};invoices.forEach(i=>(i.items||[]).forEach(x=>{const k=x.name||serviceName(x.serviceId);byService[k]=(byService[k]||0)+Number(x.quantity||1)}));
 const top=Object.entries(byService).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const byStaff={};invoices.forEach(i=>{const k=staffName(i.staffId);byStaff[k]=(byStaff[k]||0)+Number(i.total||0)});
 return `<div class="card"><h2>مساعد المالكة — تحليل الإيرادات</h2><p class="muted">التحليل يعتمد على الفواتير والمصروفات المحفوظة في النظام، وليس توقعات أو بيانات خارجية.</p><div class="stats"><div class="stat"><span>إيرادات الشهر الحالي</span><strong>${money(monthly)}</strong></div><div class="stat"><span>جميع الإيرادات</span><strong>${money(total)}</strong></div><div class="stat"><span>المصروفات المسجلة</span><strong>${money(expenses)}</strong></div><div class="stat"><span>صافي تقديري إجمالي</span><strong>${money(total-expenses)}</strong></div></div><h3>الخدمات الأكثر تنفيذًا</h3><p>${top.length?top.map(([k,v])=>`${esc(k)} (${v})`).join(' • '):'لا توجد بيانات كافية'}</p><h3>الإيرادات حسب الموظفة</h3><p>${Object.entries(byStaff).map(([k,v])=>`${esc(k)}: ${money(v)}`).join(' • ')||'لا توجد بيانات كافية'}</p></div>
 <div class="card" style="margin-top:14px"><h2>تسجيل فواتير من رسالة أو صورة</h2><div class="field"><label>ارفعي صورة كشف أو لقطة محادثة واتساب</label><input id="assistantImage" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" multiple onchange="assistantImagesSelected()"><small class="muted">يمكن اختيار عدة صور. تتم قراءة النص داخل المتصفح ثم مراجعته قبل إنشاء الفواتير.</small></div><div class="row" style="margin:12px 0"><button type="button" class="btn secondary" id="assistantOcrBtn" onclick="readAssistantImages()">قراءة الصور واستخراج النص</button><span id="assistantOcrStatus" class="muted tiny"></span></div><div id="assistantImagePreviews" class="row"></div><h3>النص المستخرج أو المكتوب</h3><p class="muted">كل عميلة في سطر مستقل: الاسم، رقم الجوال، الخدمة أو الخدمات، الموظفة (اختياري)، طريقة الدفع (اختياري). يمكن لصق رسائل متعددة. يجب مراجعة النتائج قبل الحفظ.</p><textarea id="assistantInput" rows="7" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px" placeholder="نورة أحمد، 0501234567، مانيكير وباديكير، ليان، شبكة&#10;سارة محمد، 0551234567، جل، نقدًا"></textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="parseAssistantInvoices()">استخراج الفواتير للمراجعة</button><button class="btn secondary" onclick="ownerTab('services')">إدارة أسعار الخدمات</button></div><div id="assistantPreview" style="margin-top:14px"></div><p class="notice">قراءة الصور تستخدم مكتبة Tesseract.js يتم تنزيلها من الإنترنت عند الاستخدام لأول مرة، وتعمل المعالجة في المتصفح. لا يتم إرسال الصور إلى نموذج ذكاء اصطناعي، لكن يلزم اتصال لتحميل المكتبة وملفات اللغة. راجعي النص المستخرج، فقد يخطئ في الأسماء والأرقام. لا يتم حفظ أي فاتورة قبل تأكيدك.</p></div>`;
}
let assistantImageFiles=[];
function assistantImagesSelected(){
 assistantImageFiles=Array.from($('#assistantImage')?.files||[]).filter(f=>f.type.startsWith('image/'));
 const root=$('#assistantImagePreviews');if(root)root.textContent=assistantImageFiles.length?`تم اختيار ${assistantImageFiles.length} صورة`:'لم يتم اختيار صور';
}
async function readAssistantImages(){
 const status=$('#assistantOcrStatus'),btn=$('#assistantOcrBtn');
 if(!assistantImageFiles.length){toast('اختاري صورة أولًا');return}
 btn.disabled=true;
 try{
  status.textContent='جارٍ تحميل قارئ الصور…';
  if(!window.Tesseract){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('تعذر تحميل مكتبة قراءة الصور'));document.head.appendChild(sc)})}
  const worker=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent=`قراءة الصورة: ${Math.round((m.progress||0)*100)}%`}});
  try{
   const texts=[];
   for(let i=0;i<assistantImageFiles.length;i++){
    status.textContent=`قراءة الصورة ${i+1} من ${assistantImageFiles.length}…`;
    const result=await worker.recognize(assistantImageFiles[i]);texts.push(result.data.text.trim());
   }
   const input=$('#assistantInput');input.value=[input.value.trim(),...texts].filter(Boolean).join('\n');
   status.textContent='اكتملت القراءة. راجعي النص وعدّليه ثم اضغطي استخراج الفواتير للمراجعة.';
  }finally{await worker.terminate()}
 }catch(e){console.error(e);status.textContent='تعذرت قراءة الصور. تأكدي من الاتصال أو اكتبي البيانات يدويًا.';toast('تعذرت قراءة الصور')}
 finally{btn.disabled=false}
}
function normalizeAssistant(v){return String(v||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064b-\u065f]/g,'').trim()}
function parseAssistantInvoices(){
 assistantDraft=[];const lines=($('#assistantInput')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
 for(const line of lines){
  const parts=line.split(/[،,|؛;]/).map(x=>x.trim()).filter(Boolean), phone=(line.match(/(?:\+?966|0)5\d{8}/)||[])[0]||'';
  const services=activeServices().filter(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name))||(s.nameEn&&normalizeAssistant(line).includes(normalizeAssistant(s.nameEn))));
  const employee=activeStaff().find(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name)));
  const payment=/شبك|بطاق|مدى|card/i.test(line)?'card':/تحويل/.test(line)?'transfer':/نقد|كاش|cash/i.test(line)?'cash':'';
  let name=parts.find(x=>!/(?:\+?966|0)5\d{8}/.test(x)&&!services.some(s=>normalizeAssistant(x).includes(normalizeAssistant(s.name)))&&!/شبك|بطاق|مدى|تحويل|نقد|كاش|cash|card/i.test(x)&&(!employee||!normalizeAssistant(x).includes(normalizeAssistant(employee.name))))||'';
  if(!name&&parts.length)name=parts[0].replace(phone,'').trim();
  assistantDraft.push({name,phone,services:services.map(s=>s.id),staffId:employee?.id||'',payment:payment||'cash',date:today(),error:!name||!phone||!services.length});
 }
 renderAssistantPreview();
}
function renderAssistantPreview(){const root=$('#assistantPreview');if(!root)return;
 root.innerHTML=assistantDraft.length?assistantDraft.map((r,i)=>`<div class="card" style="margin-bottom:10px"><h3>فاتورة ${i+1} ${r.error?'— تحتاج إكمال':''}</h3><div class="form-grid"><div class="field"><label>الاسم</label><input value="${esc(r.name)}" onchange="assistantDraft[${i}].name=this.value.trim()"></div><div class="field"><label>الجوال</label><input value="${esc(r.phone)}" onchange="assistantDraft[${i}].phone=this.value.trim()"></div><div class="field full"><label>الخدمات (يمكن اختيار أكثر من خدمة)</label><div class="row">${activeServices().map(s=>`<label class="checkline"><input type="checkbox" ${r.services.includes(s.id)?'checked':''} onchange="assistantToggleService(${i},'${s.id}',this.checked)">${esc(s.name)} (${money(s.price)})</label>`).join('')}</div></div><div class="field"><label>الموظفة</label><select onchange="assistantDraft[${i}].staffId=this.value"><option value="">بدون تحديد</option>${activeStaff().map(s=>`<option value="${s.id}" ${r.staffId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>الدفع</label><select onchange="assistantDraft[${i}].payment=this.value">${[['cash','نقدًا'],['card','شبكة'],['transfer','تحويل']].map(([v,n])=>`<option value="${v}" ${r.payment===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input type="date" value="${r.date}" onchange="assistantDraft[${i}].date=this.value"></div><div class="field"><label>الإجمالي</label><strong>${money(r.services.reduce((a,id)=>a+Number(db.services.find(s=>s.id===id)?.price||0),0))}</strong></div></div><button class="btn danger small" onclick="assistantDraft.splice(${i},1);renderAssistantPreview()">استبعاد</button></div>`).join('')+`<button class="btn success" onclick="saveAssistantInvoices()">تأكيد وحفظ جميع الفواتير (${assistantDraft.length})</button>`:'<div class="empty">لا توجد فواتير مستخرجة. اكتبي بيانات عميلة في كل سطر.</div>';
}
function assistantToggleService(i,id,on){const a=assistantDraft[i];if(!a)return;a.services=on?[...new Set([...a.services,id])]:a.services.filter(x=>x!==id);renderAssistantPreview()}
function saveAssistantInvoices(){if(db.session?.type!=='owner')return;
 if(!assistantDraft.length)return;
 if(assistantDraft.some(r=>!r.name.trim()||!/(?:\+?966|0)5\d{8}/.test(r.phone)||!r.services.length||!r.date)){toast('أكملي الاسم والجوال والخدمات والتاريخ لكل فاتورة');return}
 const phones=assistantDraft.map(r=>r.phone.replace(/\D/g,''));if(new Set(phones).size!==phones.length){toast('يوجد رقم جوال مكرر بين الفواتير؛ راجعي قبل الحفظ');return}
 if(!confirm(`تأكيد إصدار ${assistantDraft.length} فاتورة؟ سيتم احتساب نقاط الولاء فورًا.`))return;
 for(const r of assistantDraft){let client=db.clients.find(c=>String(c.phone||'').replace(/\D/g,'')===r.phone.replace(/\D/g,''));if(!client){client={id:uid('cl'),code:'CL-'+db.counter++,name:r.name,phone:r.phone,points:0,createdAt:new Date().toISOString()};db.clients.push(client)}
 const items=r.services.map(id=>{const s=db.services.find(x=>x.id===id);return {serviceId:id,name:s.name,price:Number(s.price)||0,quantity:1,duration:Number(s.duration)||30,lineTotal:Number(s.price)||0}}),subtotal=items.reduce((n,x)=>n+x.lineTotal,0),earned=items.reduce((n,x)=>n+Math.max(0,Math.floor(Number(db.services.find(s=>s.id===x.serviceId)?.loyaltyPoints)||0)),0);
 db.invoices.push({id:uid('inv'),number:db.invoiceCounter++,clientId:client.id,customerName:client.name,customerPhone:client.phone,staffId:r.staffId,items,serviceId:items[0].serviceId,serviceName:items.map(x=>x.name).join('، '),subtotal,discount:0,taxRate:0,tax:0,total:subtotal,payment:r.payment,pointsUsed:0,loyaltyDiscount:0,pointsAdded:earned,pointsEarned:earned,notes:'أدخلت من مساعد المالكة بعد المراجعة',date:r.date,createdAt:new Date().toISOString()});client.points=Number(client.points||0)+earned;
 for(const item of items){const svc=db.services.find(s=>s.id===item.serviceId);for(const mat of svc?.materials||[]){const stock=db.inventory.find(i=>i.id===mat.itemId);if(stock)stock.quantity=Math.max(0,Number(stock.quantity)-Number(mat.qty||0))}}
 }
 const n=assistantDraft.length;assistantDraft=[];persist();renderOwner('invoices');toast(`تم حفظ ${n} فاتورة وإضافة نقاط الولاء`);
}

/* attach forms after owner panel rendering */
const originalRenderOwner=renderOwner;
renderOwner=function(tab=ownerActiveTab){originalRenderOwner(tab);if(tab==="inventory")setupInventory();if(tab==="staff")setupStaff();if(tab==="services")setupServices();if(tab==="expenses")setupExpenses()};
applyLang();renderHome();
auth.onAuthStateChanged(async user=>{
  if(loginInProgress)return;
  if(!user){firebaseReady=false;db.session=null;renderHome();return;}
  try{const snap=await salonDoc.get();if(!snap.exists){firebaseReady=true;db={...db,session:{type:"owner",id:user.uid}};const cleanRecords=arr=>(arr||[]).map(({password,...record})=>record);await salonDoc.set({...db,clients:cleanRecords(db.clients),staff:cleanRecords(db.staff),session:null,schemaVersion:2,updatedAt:new Date().toISOString()});}else{const remote=snap.data(),base=initialState();db={...base,...remote,settings:{...base.settings,...(remote.settings||{})},session:{type:"owner",id:user.uid}};firebaseReady=true;}localStorage.setItem(STORAGE_KEY,JSON.stringify({...db,session:null}));renderOwner(ownerActiveTab);}catch(err){console.error(err);firebaseReady=false;try{await auth.signOut()}catch(_){}renderHome();setTimeout(()=>toast("تعذر الوصول إلى بيانات الصالون. تحققي من UID في قواعد Firestore."),100);}
});
</script>
