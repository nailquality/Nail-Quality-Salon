<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة العميلة</title>
  <style>
    body {
      margin: 0;
      background: #fffafc;
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #f0d7df;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 22px rgba(199, 92, 122, 0.08);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    h2 {
      color: #c65d7a;
      margin: 0;
    }
    .logout-btn {
      border: none;
      background: #d94f4f;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .card {
      background: #fff6f9;
      border: 1px solid #f0d7df;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .label {
      color: #7d5d66;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 8px;
    }
    .big {
      font-size: 1.15rem;
      font-weight: bold;
      color: #2b1c22;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h2>لوحة العميلة</h2>
      <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="card">
      <div class="label">مرحباً</div>
      <div class="big" id="welcomeName">...</div>
    </div>

    <div class="card">
      <div class="label">رقم الجوال</div>
      <div class="big" id="phoneText">...</div>
    </div>

    <div class="card">
      <div class="label">مواعيدي القادمة</div>
      <div>لا توجد مواعيد حالياً</div>
    </div>

    <div class="card">
      <div class="label">نقاط الولاء</div>
      <div class="big">0 نقطة</div>
    </div>
  </div>

  <script>
    const CURRENT_CLIENT_KEY = "nail_quality_current_client";

    const client = JSON.parse(localStorage.getItem(CURRENT_CLIENT_KEY) || "null");

    if (!client) {
      window.location.href = "index.html";
    } else {
      document.getElementById("welcomeName").textContent = client.name;
      document.getElementById("phoneText").textContent = client.phone;
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(CURRENT_CLIENT_KEY);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
